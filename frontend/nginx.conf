server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 10m;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  # One address for everything: the browser calls /api, nginx forwards it to the API container.
  # The variable makes nginx look the name up per request, so it starts even if the API is still booting.
  resolver 127.0.0.11 valid=10s;
  location /api/ {
    set $api http://api:8000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;  # a few actions wait for the slow model
  }
  # Public report page that prospects open from the email link.
  location /r/ {
    set $api http://api:8000;
    proxy_pass $api;
    proxy_set_header Host $host;
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
